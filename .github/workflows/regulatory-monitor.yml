name: Weekly official EU AI source monitor

on:
  schedule:
    - cron: '0 7 * * 1' # 07:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eu-ai-act-official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sources without changing compliance rules
        run: python scripts/check_official_sources.py
      - name: Commit only meaningful source changes
        run: |
          git config user.name "eu-ai-act-source-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/regulatory-monitor.json data/regulatory-changes.jsonl
          if git diff --cached --quiet; then
            echo "NO_CHANGE: official source hashes unchanged."
            exit 0
          fi
          git commit -m "Monitor official EU AI sources"
          git push
